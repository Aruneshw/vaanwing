services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studynest:studynest@db:5432/studynest
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
    ports: ["8000:8000"]
    volumes: [storage:/data/storage]
    depends_on: [db, redis]

  worker:  # runs ingestion jobs (extraction, transcription, captions, embeddings, question generation)
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studynest:studynest@db:5432/studynest
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
    command: rq worker ingest --url redis://redis:6379/0
    volumes: [storage:/data/storage]
    depends_on: [db, redis]

  db:
    image: postgres:16
    environment: { POSTGRES_USER: studynest, POSTGRES_PASSWORD: studynest, POSTGRES_DB: studynest }
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7

volumes: { pgdata: {}, storage: {} }
